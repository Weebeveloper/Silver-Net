<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silver Net</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2214%22%20fill=%22%2316110c%22/%3E%3Crect%20x=%223%22%20y=%223%22%20width=%2258%22%20height=%2258%22%20rx=%2211%22%20fill=%22none%22%20stroke=%22%23392e22%22%20stroke-width=%222%22/%3E%3Cpath%20d=%22M14%2020c6-3%2012-3%2018%201%206-4%2012-4%2018-1v28c-6-3-12-3-18%201-6-4-12-4-18-1z%22%20fill=%22%23211a14%22%20stroke=%22%23c9a227%22%20stroke-width=%222.5%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M32%2021v28%22%20stroke=%22%23c9a227%22%20stroke-width=%222%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2215%22%20r=%229%22%20fill=%22%23e6c665%22%20stroke=%22%23c9a227%22%20stroke-width=%222%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2215%22%20r=%225.5%22%20fill=%22none%22%20stroke=%22%239a7b17%22%20stroke-width=%221.5%22/%3E%3Cpath%20d=%22M32%2011.5v7M34.3%2012.8c-.6-.8-3.8-.9-3.8.5%200%201.9%204%201%204%202.9%200%201.5-3.4%201.4-4.1.4%22%20fill=%22none%22%20stroke=%22%239a7b17%22%20stroke-width=%221.2%22%20stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16110c;
    --panel: #1c1611;
    --panel-2: #211a14;
    --border: #392e22;
    --border-soft: #2a2219;
    --gold: #c9a227;
    --gold-bright: #e6c665;
    --text: #ece4d6;
    --text-dim: #a79b86;
    --text-faint: #756a58;
    --green: #7fae63;
    --red: #c06a5c;
    --danger-bg: rgba(192,106,92,0.12);
    --gain-bg: rgba(127,174,99,0.12);
  }
  *{box-sizing:border-box;}
  html, body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
  }
  ::selection{ background: var(--gold); color:#1c1611; }

  input, select, button, textarea{ font-family:inherit; }
  input[type="text"], input[type="number"]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:8px 10px;
    font-size:14px;
    width:100%;
    outline:none;
    transition:border-color .15s ease;
  }
  input[type="text"]:focus, input[type="number"]:focus{
    border-color:var(--gold);
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type="number"]{ -moz-appearance:textfield; }

  button{
    cursor:pointer;
    font-size:13px;
  }
  .btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:6px;
    padding:9px 12px;
    transition:border-color .15s ease, color .15s ease;
  }
  .btn:hover{ border-color:var(--gold); color:var(--text); }
  .btn-gold{
    background:var(--gold);
    border:1px solid var(--gold);
    color:#1c1611;
    font-weight:600;
  }
  .btn-gold:hover{ background:var(--gold-bright); border-color:var(--gold-bright); color:#1c1611; }
  .btn-ghost{
    background:transparent;
    border:1px solid transparent;
    color:var(--text-faint);
    padding:4px 6px;
    border-radius:4px;
  }
  .btn-ghost:hover{ color:var(--red); background:var(--danger-bg); }

  .app{ display:flex; height:100vh; width:100vw; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:270px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  .brand{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--border-soft);
    flex-shrink:0;
  }
  .brand-row{ display:flex; align-items:center; gap:12px; }
  .brand-logo{ width:40px; height:40px; flex-shrink:0; border-radius:10px; }
  .brand h1{
    font-family:'Cinzel', serif;
    font-size:20px;
    font-weight:600;
    color:var(--gold-bright);
    margin:0 0 2px;
    letter-spacing:0.02em;
  }
  .brand p{
    margin:0;
    font-size:12px;
    color:var(--text-faint);
  }
  .job-list{
    flex:1;
    overflow-y:auto;
    padding:12px;
    min-height:0;
  }
  .job-card{
    position:relative;
    padding:12px 34px 12px 14px;
    border-radius:8px;
    border:1px solid transparent;
    margin-bottom:6px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .job-card:hover{ background:var(--panel-2); }
  .job-card.active{
    background:var(--panel-2);
    border-color:var(--gold);
  }
  .job-card .job-name{
    font-size:14px;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .job-card .job-profit{
    font-size:13px;
    margin-top:3px;
    font-variant-numeric:tabular-nums;
  }
  .job-card .job-profit.pos{ color:var(--green); }
  .job-card .job-profit.neg{ color:var(--red); }
  .job-card .del-btn{
    position:absolute;
    top:8px; right:6px;
    font-size:14px;
    line-height:1;
  }
  .sidebar-footer{
    padding:14px 12px;
    border-top:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    gap:8px;
    flex-shrink:0;
  }
  .row-2{ display:flex; gap:8px; }
  .row-2 .btn{ flex:1; }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    height:100vh;
    overflow-y:auto;
    min-width:0;
  }
  .main-inner{
    max-width:680px;
    margin:0 auto;
    padding:28px 32px 60px;
  }
  .empty-state{
    max-width:420px;
    margin:80px auto;
    text-align:center;
    color:var(--text-faint);
  }
  .empty-state h2{
    font-family:'Cinzel', serif;
    color:var(--text-dim);
    font-weight:600;
    font-size:18px;
  }

  .field{ margin-bottom:18px; }
  .field label{
    display:block;
    font-size:12px;
    color:var(--text-faint);
    letter-spacing:0.03em;
    margin-bottom:6px;
  }
  .job-name-input{
    font-family:'Cinzel', serif;
    font-size:19px;
    font-weight:600;
    padding:10px 12px;
  }
  .hint{
    font-size:12px;
    color:var(--text-faint);
    margin-top:5px;
  }
  .starting-row{ display:flex; align-items:flex-end; gap:14px; }
  .starting-row .field{ flex:1; margin-bottom:0; }
  .starting-row .hint{ margin-top:0; padding-bottom:9px; white-space:nowrap; }

  .section-label{
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--gold);
    text-transform:uppercase;
    margin:30px 0 12px;
    padding-bottom:8px;
    border-bottom:1px solid var(--border-soft);
  }

  .prod-grid{
    display:grid;
    grid-template-columns:1fr 100px 140px;
    gap:10px;
    align-items:end;
  }
  .prod-grid .field{ margin-bottom:0; }
  .revenue-line{
    display:flex;
    justify-content:space-between;
    margin-top:12px;
    font-size:14px;
    color:var(--text-dim);
  }
  .revenue-line b{ color:var(--text); font-variant-numeric:tabular-nums; }

  .return-config{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel-2);
    border:1px solid var(--border-soft);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:14px;
    font-size:13px;
    color:var(--text-dim);
  }
  .return-config input[type="checkbox"]{ accent-color:var(--gold); width:15px; height:15px; }
  .return-config input[type="number"]{ width:70px; padding:5px 8px; }
  .return-config .rc-label{ flex-shrink:0; }

  .expense-row{
    border:1px solid var(--border-soft);
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    background:var(--panel-2);
  }
  .expense-row-top{
    display:grid;
    grid-template-columns:1fr 80px 110px 24px;
    gap:8px;
    align-items:center;
  }
  .expense-row-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:9px;
    padding-top:9px;
    border-top:1px solid var(--border-soft);
    font-size:12.5px;
  }
  .returnable-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--text-faint);
  }
  .returnable-toggle input{ accent-color:var(--gold); width:14px; height:14px; }
  .cost-figures{ text-align:right; }
  .cost-figures .raw-strike{
    text-decoration:line-through;
    color:var(--text-faint);
    margin-right:6px;
  }
  .cost-figures .net{
    color:var(--text);
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .cost-figures .buy-note{
    color:var(--green);
    margin-top:2px;
  }
  .add-item-btn{
    background:none;
    border:1px dashed var(--border);
    color:var(--gold);
    width:100%;
    padding:9px;
    border-radius:8px;
    font-size:13px;
  }
  .add-item-btn:hover{ border-color:var(--gold); background:var(--panel-2); }

  .totals-box{
    margin-top:14px;
    display:flex;
    justify-content:space-between;
    font-size:13.5px;
    color:var(--text-dim);
  }
  .totals-box b{ color:var(--text); font-variant-numeric:tabular-nums; }

  .summary-panel{
    margin-top:26px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
    background:var(--panel-2);
  }
  .summary-line{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .summary-line b{ font-variant-numeric:tabular-nums; }
  .summary-line.expense b{ color:var(--red); }
  .summary-divider{ border-top:1px solid var(--border-soft); margin:12px 0; }
  .profit-line{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:6px;
  }
  .profit-line .label{ font-size:12px; letter-spacing:0.06em; color:var(--gold); text-transform:uppercase; }
  .profit-line .value{
    font-family:'Cinzel', serif;
    font-size:26px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .profit-line .value.pos{ color:var(--green); }
  .profit-line .value.neg{ color:var(--red); }
  .stash-note{
    margin-top:14px;
    font-size:12.5px;
    color:var(--text-faint);
    line-height:1.5;
  }
  .stash-note .tag{
    display:inline-block;
    font-size:10.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:1px 7px;
    border-radius:4px;
    margin-left:4px;
    position:relative;
    top:-1px;
  }
  .tag.gain{ background:var(--gain-bg); color:var(--green); }
  .tag.hit{ background:var(--danger-bg); color:var(--red); }
  .tag.flat{ background:var(--border-soft); color:var(--text-faint); }

  /* ---------- Scratchpad ---------- */
  .scratch-panel{
    width:300px;
    flex-shrink:0;
    height:100vh;
    background:var(--panel);
    border-left:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
  }
  .scratch-header{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--border-soft);
    flex-shrink:0;
  }
  .scratch-header h2{
    font-family:'Cinzel', serif;
    font-size:15px;
    font-weight:600;
    color:var(--gold-bright);
    margin:0 0 3px;
  }
  .scratch-header p{
    margin:0;
    font-size:11.5px;
    color:var(--text-faint);
    line-height:1.5;
  }
  .scratch-list{
    flex:1;
    overflow-y:auto;
    min-height:0;
    padding:14px;
  }
  .scratch-row{
    border:1px solid var(--border-soft);
    background:var(--panel-2);
    border-radius:8px;
    padding:10px;
    margin-bottom:9px;
  }
  .scratch-row-top{
    display:flex;
    gap:6px;
    margin-bottom:7px;
  }
  .scratch-row input[type="text"]{ font-size:12.5px; padding:6px 8px; }
  .scratch-label{ width:40%; color:var(--text-dim); }
  .scratch-expr{ flex:1; font-variant-numeric:tabular-nums; }
  .scratch-result{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .scratch-result .val{
    font-size:15px;
    font-weight:600;
    color:var(--gold-bright);
    font-variant-numeric:tabular-nums;
  }
  .scratch-result .val.err{ color:var(--text-faint); font-weight:400; font-size:12px; }
  .scratch-actions{ display:flex; gap:4px; }
  .scratch-actions button{
    font-size:11px;
    padding:4px 8px;
  }
  .scratch-add{
    margin:4px 14px 14px;
  }
  .scratch-empty{
    color:var(--text-faint);
    font-size:12.5px;
    text-align:center;
    padding:30px 10px;
    line-height:1.6;
  }
  .insert-target-note{
    font-size:11px;
    color:var(--text-faint);
    padding:0 14px 12px;
    line-height:1.5;
    flex-shrink:0;
  }
  .insert-target-note b{ color:var(--gold); }

  /* ---------- Mobile toggles ---------- */
  .mobile-bar{ display:none; }

  @media (max-width: 900px){
    .app{ flex-direction:column; height:auto; min-height:100vh; overflow:visible; }
    html, body{ overflow:auto; }
    .mobile-bar{
      display:flex;
      gap:8px;
      padding:10px 12px;
      background:var(--panel);
      border-bottom:1px solid var(--border-soft);
      position:sticky;
      top:0;
      z-index:5;
    }
    .mobile-bar .btn{ flex:1; }
    .sidebar, .scratch-panel{
      height:auto;
      max-height:0;
      overflow:hidden;
      border:none;
      transition:max-height .2s ease;
    }
    .sidebar.open, .scratch-panel.open{ max-height:70vh; overflow-y:auto; border-bottom:1px solid var(--border-soft); }
    .main{ height:auto; overflow:visible; }
    .main-inner{ padding:20px 16px 50px; }
    .prod-grid{ grid-template-columns:1fr; }
    .expense-row-top{ grid-template-columns:1fr 1fr 1fr 24px; }
  }
</style>
</head>
<body>

<div class="mobile-bar">
  <button class="btn" id="toggleSidebarBtn">Jobs</button>
  <button class="btn" id="toggleScratchBtn">Scratchpad</button>
</div>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-row">
        <img class="brand-logo" alt="" src="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2214%22%20fill=%22%2316110c%22/%3E%3Crect%20x=%223%22%20y=%223%22%20width=%2258%22%20height=%2258%22%20rx=%2211%22%20fill=%22none%22%20stroke=%22%23392e22%22%20stroke-width=%222%22/%3E%3Cpath%20d=%22M14%2020c6-3%2012-3%2018%201%206-4%2012-4%2018-1v28c-6-3-12-3-18%201-6-4-12-4-18-1z%22%20fill=%22%23211a14%22%20stroke=%22%23c9a227%22%20stroke-width=%222.5%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M32%2021v28%22%20stroke=%22%23c9a227%22%20stroke-width=%222%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2215%22%20r=%229%22%20fill=%22%23e6c665%22%20stroke=%22%23c9a227%22%20stroke-width=%222%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2215%22%20r=%225.5%22%20fill=%22none%22%20stroke=%22%239a7b17%22%20stroke-width=%221.5%22/%3E%3Cpath%20d=%22M32%2011.5v7M34.3%2012.8c-.6-.8-3.8-.9-3.8.5%200%201.9%204%201%204%202.9%200%201.5-3.4%201.4-4.1.4%22%20fill=%22none%22%20stroke=%22%239a7b17%22%20stroke-width=%221.2%22%20stroke-linecap=%22round%22/%3E%3C/svg%3E">
        <div>
          <h1>Silver Net</h1>
          <p>job cost &amp; profit tracker</p>
        </div>
      </div>
    </div>
    <div class="job-list" id="jobList"></div>
    <div class="sidebar-footer">
      <button class="btn btn-gold" id="newJobBtn">+ New job</button>
      <div class="row-2">
        <button class="btn" id="exportBtn">Export JSON</button>
        <button class="btn" id="importBtn">Import JSON</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
  </aside>

  <main class="main" id="main">
    <div class="main-inner" id="mainInner">
      <!-- rendered by JS -->
    </div>
  </main>

  <aside class="scratch-panel" id="scratchPanel">
    <div class="scratch-header">
      <h2>Scratchpad</h2>
      <p>Jot down anything — compare item variants, test a price, work out a temporary number. Type math like <b>296*16</b> straight into a row.</p>
    </div>
    <div class="scratch-list" id="scratchList"></div>
    <div class="scratch-add">
      <button class="add-item-btn" id="addScratchBtn">+ Add row</button>
    </div>
    <div class="insert-target-note" id="insertNote">Click into a number field in the ledger, then hit <b>Send</b> on a row to drop its value in.</div>
  </aside>

</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "guildLedgerState_v2";
  let state = null;
  let lastFocusedInput = null;

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function defaultJob(name){
    return {
      id: uid(),
      name: name || "New job",
      startingSilver: 0,
      production: { item: "", qty: 0, sellPrice: 0 },
      returnRateEnabled: false,
      returnRate: 0,
      expenses: []
    };
  }

  function defaultExpense(item, qty, price, returnable){
    return { id: uid(), item: item || "", qty: qty || 0, price: price || 0, returnable: !!returnable };
  }

  function loadState(){
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch(e){}
    if(!raw){
      // try migrating from an older save key if present
      try { raw = localStorage.getItem("guildLedgerState"); } catch(e){}
    }
    if(raw){
      try{
        const parsed = JSON.parse(raw);
        return migrate(parsed);
      }catch(e){ /* fall through to sample */ }
    }
    return sampleState();
  }

  function migrate(parsed){
    const jobs = (parsed.jobs || []).map(j => {
      const job = {
        id: j.id || uid(),
        name: j.name || "Untitled job",
        startingSilver: j.startingSilver != null ? j.startingSilver : (j.budget || 0),
        production: j.production || { item: "", qty: 0, sellPrice: 0 },
        returnRateEnabled: j.returnRateEnabled != null ? j.returnRateEnabled : false,
        returnRate: j.returnRate != null ? j.returnRate : 0,
        expenses: []
      };
      let inferredRate = null;
      job.expenses = (j.expenses || j.items || []).map(it => {
        const returnable = it.returnable != null ? it.returnable : false;
        if(returnable && it.returnPercent != null && inferredRate === null){
          inferredRate = it.returnPercent;
        }
        return defaultExpense(it.item || it.name, it.qty, it.price, returnable);
      });
      if(!j.returnRate && inferredRate !== null){
        job.returnRate = inferredRate;
        job.returnRateEnabled = true;
      }
      return job;
    });
    return {
      jobs: jobs.length ? jobs : [defaultJob()],
      activeJobId: parsed.activeJobId && jobs.some(j => j.id === parsed.activeJobId) ? parsed.activeJobId : (jobs[0] ? jobs[0].id : null),
      scratch: parsed.scratch || []
    };
  }

  function sampleState(){
    const job = defaultJob("Deathgivers Bridgewatch");
    job.startingSilver = 3507579;
    job.production = { item: "Deathgivers", qty: 12, sellPrice: 56886 };
    job.returnRateEnabled = true;
    job.returnRate = 15.2;
    job.expenses = [
      defaultExpense("Bars 4.0", 16, 296, true),
      defaultExpense("Leather 4.0", 16, 460, true)
    ];
    return {
      jobs: [job],
      activeJobId: job.id,
      scratch: [
        { id: uid(), label: "Leather 4.0", expr: "460*16" },
        { id: uid(), label: "Leather 4.2", expr: "512*16" }
      ]
    };
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function getActiveJob(){
    return state.jobs.find(j => j.id === state.activeJobId) || null;
  }

  // ---------- number helpers ----------
  function parseNum(v){
    if(typeof v === "number") return v;
    if(!v) return 0;
    const n = parseFloat(String(v).replace(/,/g,""));
    return isNaN(n) ? 0 : n;
  }

  function formatWithCommas(raw){
    if(raw === "" || raw === "-") return raw;
    let neg = raw.startsWith("-");
    if(neg) raw = raw.slice(1);
    let [intPart, decPart] = raw.split(".");
    intPart = intPart.replace(/^0+(?=\d)/, "");
    let formattedInt = intPart ? Number(intPart).toLocaleString("en-US") : "";
    let out = (neg ? "-" : "") + formattedInt;
    if(decPart !== undefined) out += "." + decPart;
    return out;
  }

  function fmt(n, opts){
    opts = opts || {};
    const max = opts.decimals != null ? opts.decimals : 2;
    if(n === null || n === undefined || isNaN(n)) return "0";
    let s = n.toLocaleString("en-US", { maximumFractionDigits: max });
    return s;
  }

  function attachCommaInput(el, onChange){
    el.addEventListener("input", function(){
      const cursorFromEnd = el.value.length - el.selectionStart;
      let raw = el.value.replace(/,/g, "").replace(/[^0-9.\-]/g, "");
      // keep only first decimal point and leading minus
      let firstDot = raw.indexOf(".");
      if(firstDot !== -1){
        raw = raw.slice(0, firstDot+1) + raw.slice(firstDot+1).replace(/\./g, "");
      }
      el.value = formatWithCommas(raw);
      const pos = Math.max(0, el.value.length - cursorFromEnd);
      el.setSelectionRange(pos, pos);
      onChange(parseNum(el.value));
    });
    el.addEventListener("focus", function(){ lastFocusedInput = el; });
  }

  // ---------- rendering ----------
  const jobListEl = document.getElementById("jobList");
  const mainInnerEl = document.getElementById("mainInner");
  const scratchListEl = document.getElementById("scratchList");

  function computeJobTotals(job){
    const revenue = parseNum(job.production.qty) * parseNum(job.production.sellPrice);
    const rate = job.returnRateEnabled ? Math.min(100, Math.max(0, parseNum(job.returnRate))) : 0;
    const keepFrac = 1 - (rate / 100);

    let rawTotal = 0, netTotal = 0;
    const rows = job.expenses.map(exp => {
      const qty = parseNum(exp.qty);
      const price = parseNum(exp.price);
      const raw = qty * price;
      const applies = exp.returnable && job.returnRateEnabled && rate > 0;
      const net = applies ? raw * keepFrac : raw;
      const buyQty = applies ? qty * keepFrac : qty;
      rawTotal += raw;
      netTotal += net;
      return { raw, net, applies, buyQty, qty, rate };
    });

    const profit = revenue - netTotal;
    return { revenue, rawTotal, netTotal, profit, rows, rate, keepFrac };
  }

  function renderJobList(){
    jobListEl.innerHTML = "";
    if(state.jobs.length === 0){
      const empty = document.createElement("div");
      empty.className = "scratch-empty";
      empty.textContent = "No jobs yet.";
      jobListEl.appendChild(empty);
      return;
    }
    state.jobs.forEach(job => {
      const totals = computeJobTotals(job);
      const card = document.createElement("div");
      card.className = "job-card" + (job.id === state.activeJobId ? " active" : "");
      const nameDiv = document.createElement("div");
      nameDiv.className = "job-name";
      nameDiv.textContent = job.name || "Untitled job";
      const profitDiv = document.createElement("div");
      profitDiv.className = "job-profit " + (totals.profit >= 0 ? "pos" : "neg");
      profitDiv.textContent = (totals.profit >= 0 ? "+" : "") + fmt(totals.profit) + " silver";
      const delBtn = document.createElement("button");
      delBtn.className = "btn-ghost del-btn";
      delBtn.textContent = "\u2715";
      delBtn.title = "Delete job";
      delBtn.addEventListener("click", function(e){
        e.stopPropagation();
        if(confirm('Delete "' + (job.name || "Untitled job") + '"? This can\'t be undone.')){
          state.jobs = state.jobs.filter(j => j.id !== job.id);
          if(state.activeJobId === job.id){
            state.activeJobId = state.jobs.length ? state.jobs[0].id : null;
          }
          save();
          renderAll();
        }
      });
      card.appendChild(nameDiv);
      card.appendChild(profitDiv);
      card.appendChild(delBtn);
      card.addEventListener("click", function(){
        state.activeJobId = job.id;
        save();
        renderAll();
      });
      jobListEl.appendChild(card);
    });
  }

  function renderMain(){
    mainInnerEl.innerHTML = "";
    const job = getActiveJob();
    if(!job){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = "<h2>No job open</h2><p>Start a new job from the sidebar to begin tracking its costs and profit.</p>";
      mainInnerEl.appendChild(empty);
      return;
    }

    const totals = computeJobTotals(job);

    // ---- name field ----
    const nameField = document.createElement("div");
    nameField.className = "field";
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.className = "job-name-input";
    nameInput.value = job.name;
    nameInput.placeholder = "Job name";
    nameInput.addEventListener("input", function(){
      job.name = nameInput.value;
      save();
      renderJobList();
    });
    nameField.appendChild(nameInput);
    mainInnerEl.appendChild(nameField);

    // ---- starting silver ----
    const startRow = document.createElement("div");
    startRow.className = "starting-row";
    const startField = document.createElement("div");
    startField.className = "field";
    const startLabel = document.createElement("label");
    startLabel.textContent = "Starting silver";
    const startInput = document.createElement("input");
    startInput.type = "text";
    startInput.inputMode = "decimal";
    startInput.value = fmt(job.startingSilver, { decimals: 0 });
    attachCommaInput(startInput, function(v){ job.startingSilver = v; save(); updateSummaryOnly(job); });
    startField.appendChild(startLabel);
    startField.appendChild(startInput);
    const startHint = document.createElement("div");
    startHint.className = "hint";
    startHint.textContent = "reference only \u2014 not used in the running math below";
    startRow.appendChild(startField);
    startRow.appendChild(startHint);
    mainInnerEl.appendChild(startRow);

    // ---- producing ----
    const prodLabel = document.createElement("div");
    prodLabel.className = "section-label";
    prodLabel.textContent = "Producing";
    mainInnerEl.appendChild(prodLabel);

    const prodGrid = document.createElement("div");
    prodGrid.className = "prod-grid";

    const itemField = document.createElement("div");
    itemField.className = "field";
    itemField.innerHTML = "<label>Item</label>";
    const itemInput = document.createElement("input");
    itemInput.type = "text";
    itemInput.value = job.production.item;
    itemInput.placeholder = "What are you producing?";
    itemInput.addEventListener("input", function(){
      job.production.item = itemInput.value;
      save();
    });
    itemInput.addEventListener("focus", function(){ lastFocusedInput = null; });
    itemField.appendChild(itemInput);

    const qtyField = document.createElement("div");
    qtyField.className = "field";
    qtyField.innerHTML = "<label>Quantity</label>";
    const qtyInput = document.createElement("input");
    qtyInput.type = "text";
    qtyInput.inputMode = "decimal";
    qtyInput.value = fmt(job.production.qty, { decimals: 0 });
    attachCommaInput(qtyInput, function(v){ job.production.qty = v; save(); rerenderJobNumbers(job); });
    qtyField.appendChild(qtyInput);

    const priceField = document.createElement("div");
    priceField.className = "field";
    priceField.innerHTML = "<label>Sell price / unit</label>";
    const priceInput = document.createElement("input");
    priceInput.type = "text";
    priceInput.inputMode = "decimal";
    priceInput.value = fmt(job.production.sellPrice, { decimals: 0 });
    attachCommaInput(priceInput, function(v){ job.production.sellPrice = v; save(); rerenderJobNumbers(job); });
    priceField.appendChild(priceInput);

    prodGrid.appendChild(itemField);
    prodGrid.appendChild(qtyField);
    prodGrid.appendChild(priceField);
    mainInnerEl.appendChild(prodGrid);

    const revLine = document.createElement("div");
    revLine.className = "revenue-line";
    revLine.innerHTML = '<span>Revenue</span><b id="revenueVal"></b>';
    mainInnerEl.appendChild(revLine);

    // ---- expenses ----
    const expLabel = document.createElement("div");
    expLabel.className = "section-label";
    expLabel.textContent = "Expenses";
    mainInnerEl.appendChild(expLabel);

    const returnConfig = document.createElement("div");
    returnConfig.className = "return-config";
    const rcCheck = document.createElement("input");
    rcCheck.type = "checkbox";
    rcCheck.checked = job.returnRateEnabled;
    rcCheck.id = "rcCheck";
    const rcLabel = document.createElement("label");
    rcLabel.className = "rc-label";
    rcLabel.setAttribute("for", "rcCheck");
    rcLabel.textContent = "Resource return rate applies to this job";
    const rcRate = document.createElement("input");
    rcRate.type = "text";
    rcRate.inputMode = "decimal";
    rcRate.value = fmt(job.returnRate, { decimals: 2 });
    rcRate.style.marginLeft = "auto";
    const rcPct = document.createElement("span");
    rcPct.textContent = "%";
    rcPct.style.color = "var(--text-faint)";
    rcCheck.addEventListener("change", function(){
      job.returnRateEnabled = rcCheck.checked;
      save();
      renderMain();
    });
    attachCommaInput(rcRate, function(v){ job.returnRate = v; save(); rerenderJobNumbers(job); });
    returnConfig.appendChild(rcCheck);
    returnConfig.appendChild(rcLabel);
    returnConfig.appendChild(rcRate);
    returnConfig.appendChild(rcPct);
    mainInnerEl.appendChild(returnConfig);

    const expList = document.createElement("div");
    expList.id = "expenseList";
    job.expenses.forEach((exp, idx) => {
      expList.appendChild(renderExpenseRow(job, exp, idx));
    });
    mainInnerEl.appendChild(expList);

    const addBtn = document.createElement("button");
    addBtn.className = "add-item-btn";
    addBtn.textContent = "+ Add item";
    addBtn.addEventListener("click", function(){
      job.expenses.push(defaultExpense());
      save();
      renderMain();
    });
    mainInnerEl.appendChild(addBtn);

    const totalsBox = document.createElement("div");
    totalsBox.className = "totals-box";
    totalsBox.innerHTML = '<span>Total expenses</span><b id="totalExpVal"></b>';
    mainInnerEl.appendChild(totalsBox);

    // ---- summary ----
    const summary = document.createElement("div");
    summary.className = "summary-panel";
    summary.id = "summaryPanel";
    mainInnerEl.appendChild(summary);

    updateSummaryOnly(job);
  }

  function renderExpenseRow(job, exp, idx){
    const row = document.createElement("div");
    row.className = "expense-row";

    const top = document.createElement("div");
    top.className = "expense-row-top";

    const itemInput = document.createElement("input");
    itemInput.type = "text";
    itemInput.value = exp.item;
    itemInput.placeholder = "Material name";
    itemInput.addEventListener("input", function(){ exp.item = itemInput.value; save(); });
    itemInput.addEventListener("focus", function(){ lastFocusedInput = null; });

    const qtyInput = document.createElement("input");
    qtyInput.type = "text";
    qtyInput.inputMode = "decimal";
    qtyInput.value = fmt(exp.qty, { decimals: 0 });
    attachCommaInput(qtyInput, function(v){ exp.qty = v; save(); rerenderJobNumbers(job); });

    const priceInput = document.createElement("input");
    priceInput.type = "text";
    priceInput.inputMode = "decimal";
    priceInput.value = fmt(exp.price, { decimals: 0 });
    attachCommaInput(priceInput, function(v){ exp.price = v; save(); rerenderJobNumbers(job); });

    const delBtn = document.createElement("button");
    delBtn.className = "btn-ghost";
    delBtn.textContent = "\u2715";
    delBtn.title = "Remove item";
    delBtn.addEventListener("click", function(){
      job.expenses = job.expenses.filter(e => e.id !== exp.id);
      save();
      renderMain();
    });

    top.appendChild(itemInput);
    top.appendChild(qtyInput);
    top.appendChild(priceInput);
    top.appendChild(delBtn);

    const bottom = document.createElement("div");
    bottom.className = "expense-row-bottom";

    const toggle = document.createElement("label");
    toggle.className = "returnable-toggle";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = exp.returnable;
    cb.addEventListener("change", function(){ exp.returnable = cb.checked; save(); rerenderJobNumbers(job); });
    const cbText = document.createElement("span");
    cbText.textContent = "Returns resources";
    toggle.appendChild(cb);
    toggle.appendChild(cbText);

    const figures = document.createElement("div");
    figures.className = "cost-figures";
    figures.dataset.rowFigures = exp.id;

    bottom.appendChild(toggle);
    bottom.appendChild(figures);

    row.appendChild(top);
    row.appendChild(bottom);
    return row;
  }

  // update only the numbers (revenue, per-row costs, totals, summary) without losing focus / rebuilding inputs
  function rerenderJobNumbers(job){
    const totals = computeJobTotals(job);

    const revenueVal = document.getElementById("revenueVal");
    if(revenueVal) revenueVal.textContent = fmt(totals.revenue) + " silver";

    job.expenses.forEach((exp, idx) => {
      const figures = document.querySelector('[data-row-figures="' + exp.id + '"]');
      if(!figures) return;
      const r = totals.rows[idx];
      let html = "";
      if(r.applies){
        html += '<span class="raw-strike">' + fmt(r.raw) + "</span>";
      }
      html += '<div class="net">' + fmt(r.net) + " silver</div>";
      if(r.applies){
        const returned = r.raw - r.net;
        html += '<div class="buy-note">Buy ~' + fmt(r.buyQty) + " (" + fmt(r.qty, {decimals:0}) + " \u00d7 " + fmt(100 - r.rate, {decimals:1}) + "%) \u00b7 \u2212" + fmt(returned) + " returned</div>";
      }
      figures.innerHTML = html;
    });

    const totalExpVal = document.getElementById("totalExpVal");
    if(totalExpVal){
      totalExpVal.textContent = fmt(totals.netTotal) + " silver";
    }

    updateSummaryOnly(job);
  }

  function updateSummaryOnly(job){
    const panel = document.getElementById("summaryPanel");
    if(!panel) return;
    const totals = computeJobTotals(job);
    const profit = totals.profit;
    const starting = parseNum(job.startingSilver);
    const projected = starting + profit;

    let tagClass = "flat", tagText = "No change";
    if(profit > 0){ tagClass = "gain"; tagText = "Gain"; }
    else if(profit < 0){ tagClass = "hit"; tagText = "Took a hit"; }

    panel.innerHTML =
      '<div class="summary-line"><span>Revenue (from production)</span><b>' + fmt(totals.revenue) + ' silver</b></div>' +
      '<div class="summary-line expense"><span>Expenses (materials, after returns)</span><b>\u2212' + fmt(totals.netTotal) + '</b></div>' +
      '<div class="summary-divider"></div>' +
      '<div class="profit-line"><span class="label">Profit</span><span class="value ' + (profit >= 0 ? "pos" : "neg") + '">' + (profit >= 0 ? "+" : "\u2212") + fmt(Math.abs(profit)) + ' silver</span></div>' +
      '<div class="stash-note">' + fmt(starting, {decimals:0}) + ' silver starting stash <span class="tag ' + tagClass + '">' + tagText + '</span><br>After this job, your stash would sit around ' + fmt(projected, {decimals:0}) + ' silver.</div>';
  }

  // ---------- Scratchpad ----------
  function safeEval(expr){
    const clean = expr.replace(/,/g, "").trim();
    if(clean === "") return null;
    if(!/^[0-9+\-*/().%\s]*$/.test(clean)) return null;
    try{
      // eslint-disable-next-line no-new-func
      const val = Function('"use strict"; return (' + clean + ")")();
      if(typeof val !== "number" || !isFinite(val)) return null;
      return val;
    }catch(e){ return null; }
  }

  function renderScratch(){
    scratchListEl.innerHTML = "";
    if(!state.scratch.length){
      const empty = document.createElement("div");
      empty.className = "scratch-empty";
      empty.textContent = "Nothing here yet. Add a row to test prices, compare item variants, or work out a quick sum.";
      scratchListEl.appendChild(empty);
      return;
    }
    state.scratch.forEach(row => {
      const wrap = document.createElement("div");
      wrap.className = "scratch-row";

      const top = document.createElement("div");
      top.className = "scratch-row-top";
      const labelInput = document.createElement("input");
      labelInput.type = "text";
      labelInput.className = "scratch-label";
      labelInput.placeholder = "Label";
      labelInput.value = row.label;
      labelInput.addEventListener("input", function(){ row.label = labelInput.value; save(); });

      const exprInput = document.createElement("input");
      exprInput.type = "text";
      exprInput.className = "scratch-expr";
      exprInput.placeholder = "e.g. 296*16";
      exprInput.value = row.expr;
      exprInput.addEventListener("input", function(){
        row.expr = exprInput.value;
        save();
        updateScratchResult(row.id, resultLine);
      });

      top.appendChild(labelInput);
      top.appendChild(exprInput);

      const resultLine = document.createElement("div");
      resultLine.className = "scratch-result";

      wrap.appendChild(top);
      wrap.appendChild(resultLine);
      scratchListEl.appendChild(wrap);

      updateScratchResult(row.id, resultLine, row);
    });
  }

  function updateScratchResult(rowId, resultLine, rowRef){
    const row = rowRef || state.scratch.find(r => r.id === rowId);
    if(!row) return;
    const val = safeEval(row.expr);
    const valSpan = document.createElement("span");
    if(val === null){
      valSpan.className = "val err";
      valSpan.textContent = row.expr.trim() === "" ? "\u2014" : "can't work that out";
    } else {
      valSpan.className = "val";
      valSpan.textContent = fmt(val);
    }
    const actions = document.createElement("div");
    actions.className = "scratch-actions";

    const sendBtn = document.createElement("button");
    sendBtn.className = "btn";
    sendBtn.textContent = "Send";
    sendBtn.disabled = val === null;
    sendBtn.addEventListener("click", function(){
      if(val === null) return;
      if(!lastFocusedInput || !document.body.contains(lastFocusedInput)){
        alert("Click into a number field in the ledger first, then hit Send.");
        return;
      }
      lastFocusedInput.value = formatWithCommas(String(val));
      lastFocusedInput.dispatchEvent(new Event("input", { bubbles: true }));
    });

    const delBtn = document.createElement("button");
    delBtn.className = "btn";
    delBtn.textContent = "\u2715";
    delBtn.addEventListener("click", function(){
      state.scratch = state.scratch.filter(r => r.id !== rowId);
      save();
      renderScratch();
    });

    actions.appendChild(sendBtn);
    actions.appendChild(delBtn);

    resultLine.innerHTML = "";
    resultLine.appendChild(valSpan);
    resultLine.appendChild(actions);
  }

  document.getElementById("addScratchBtn").addEventListener("click", function(){
    state.scratch.push({ id: uid(), label: "", expr: "" });
    save();
    renderScratch();
  });

  // ---------- job list actions ----------
  document.getElementById("newJobBtn").addEventListener("click", function(){
    const job = defaultJob("New job " + (state.jobs.length + 1));
    state.jobs.push(job);
    state.activeJobId = job.id;
    save();
    renderAll();
  });

  document.getElementById("exportBtn").addEventListener("click", function(){
    const dataStr = JSON.stringify(state, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = "guild-ledger-" + date + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  const importFile = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", function(){
    importFile.value = "";
    importFile.click();
  });
  importFile.addEventListener("change", function(){
    const file = importFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const parsed = JSON.parse(e.target.result);
        if(!confirm("Import this file? It will replace everything currently in the ledger.")) return;
        state = migrate(parsed);
        save();
        renderAll();
      }catch(err){
        alert("Couldn't read that file \u2014 make sure it's a Guild Ledger JSON export.");
      }
    };
    reader.readAsText(file);
  });

  // ---------- mobile toggles ----------
  const sidebarEl = document.getElementById("sidebar");
  const scratchPanelEl = document.getElementById("scratchPanel");
  document.getElementById("toggleSidebarBtn").addEventListener("click", function(){
    sidebarEl.classList.toggle("open");
    scratchPanelEl.classList.remove("open");
  });
  document.getElementById("toggleScratchBtn").addEventListener("click", function(){
    scratchPanelEl.classList.toggle("open");
    sidebarEl.classList.remove("open");
  });

  function renderAll(){
    renderJobList();
    renderMain();
    renderScratch();
  }

  state = loadState();
  renderAll();
})();
</script>
</body>
</html>
